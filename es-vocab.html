<style>

    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- COVER ---------- */
  .cover{
    background:linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:var(--gold-soft);
    padding:52px 24px 40px;
    text-align:center;
    position:relative;

  }
  @keyframes coverIn{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .cover h1{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 42px);
    margin:0 0 10px;
    letter-spacing:0.3px;
    color:#F3E9CE;

    height:2px;
    background:var(--gold);
    margin:16px auto;
    border:none;
  }
  .cover p{
    font-size:15px;
    color:#B9C3CF;
    max-width:440px;
    margin:0 auto;
    line-height:1.6;
  }

  .tabs-wrap{
    background:var(--cover);
    padding:0 12px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
    border-bottom:3px solid var(--gold);
  }
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .tabs{
    display:inline-flex;
    gap:2px;
    padding:10px 4px;
  }
  .tab-btn{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:#AEB9C6;
    background:transparent;
    border:none;
    padding:9px 14px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    transition:color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{ color:#EFE6CC; }
  .tab-btn.active{
    color:#1B2A3D;
    background:var(--gold-soft);
    font-weight:600;
  }

  /* ---------- SEARCH ---------- */
  .search-row{
    max-width:900px;
    margin:26px auto 8px;
    padding:0 20px;
  }
  .search-row input{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--paper-line);
    padding:8px 2px 10px;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-row input:focus{ border-bottom-color:var(--gold); }
  .search-row input::placeholder{ color:#A79E8C; }

  .meta-line{
    max-width:900px;
    margin:0 auto;
    padding:10px 22px 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:18px 16px 70px;
  }
  .entries{
    columns:2 340px;
    column-gap:36px;
  }
  .entry{
    break-inside:avoid;
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
    margin-bottom:2px;
  }
  .entry-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:5px;
  }
  .entry-word{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
  }
  .entry-pos{
    font-family:'Lora', serif;
    font-style:italic;
    font-size:13px;
    color:var(--teal);
  }
  .entry-en{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .entry-example{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .entry-example .es{
    font-style:italic;
  }
  .entry-example .en{
    color:var(--ink-soft);
  }

    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:14.5px;
    display:none;
  }

  footer{
    text-align:center;
    padding:22px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--paper-line);
  }

  @media (max-width:600px){
    .entries{ columns:1; }
    .cover{ padding:40px 20px 30px; }
  }
</style>
</head>

const posMap = Object.fromEntries(categories.filter(c=>c.abbr).map(c=>[c.key,c.abbr]));

const tabsEl = document.getElementById('tabs');
const entriesEl = document.getElementById('entries');
const noResultsEl = document.getElementById('noResults');
const searchEl = document.getElementById('search');
const metaLineEl = document.getElementById('metaLine');

let activeCat = 'todos';
let query = '';

function counts(){
  const c = {};
  data.forEach(d => c[d.cat] = (c[d.cat]||0)+1);
  return c;
}
const catCounts = counts();

categories.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (c.key === activeCat ? ' active' : '');
  const n = c.key === 'todos' ? data.length : (catCounts[c.key]||0);
  btn.textContent = c.label + ' (' + n + ')';
  btn.addEventListener('click', () => {
    activeCat = c.key;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
  tabsEl.appendChild(btn);
});

searchEl.addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase();
  render();
});

function render(){
  const filtered = data.filter(d => {
    const matchesCat = activeCat === 'todos' || d.cat === activeCat;
    const matchesQuery = !query || d.es.toLowerCase().includes(query) || d.en.toLowerCase().includes(query);
    return matchesCat && matchesQuery;
  });

  entriesEl.innerHTML = '';
  noResultsEl.style.display = filtered.length ? 'none' : 'block';
  metaLineEl.textContent = filtered.length + (filtered.length === 1 ? ' palabra' : ' palabras');

  filtered.forEach(d => {
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `
      <div class="entry-head">
        <span class="entry-word">${d.es}</span>
        <span class="entry-pos">${posMap[d.cat] || ''}</span>
      </div>
      <p class="entry-en">${d.en}</p>
      <p class="entry-example"><span class="es">${d.ex}</span> <span class="en">(${d.exEn})</span></p>
    `;
    entriesEl.appendChild(el);
  });
}

render();
</script>
