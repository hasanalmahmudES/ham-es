                            </div>
                        `).join('')}
                    </div>
                </div>

                <div id="sentences" class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-comment-dots"></i></div>
                        <div><h3 class="text-xl font-bold text-slate-900">Daily Sentences</h3><p class="text-xs text-slate-500">Practical phrases for Day ${data.day}</p></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${data.sentences.map((s, i) => `
                            <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl flex items-center justify-between hover:border-purple-200 hover:bg-purple-50/20 transition group">
                                <div class="flex items-center space-x-3">
                                    <span class="w-6 h-6 rounded-lg bg-purple-100 text-purple-700 font-bold text-xs flex items-center justify-center flex-shrink-0">${i+1}</span>
                                    <div><p class="font-bold text-slate-900 text-sm">${s.es}</p><p class="text-xs text-slate-500">${s.en}</p></div>
                                </div>
                                <button onclick="speakText('${s.es}')" class="text-slate-400 group-hover:text-purple-600 p-2 transition"><i class="fa-solid fa-volume-high"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div id="conversation" class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-comments"></i></div>
                        <div><h3 class="text-xl font-bold text-slate-900">Conversation Practice (Diálogo)</h3><p class="text-xs text-slate-500">Real-world scenario dialogue</p></div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 space-y-4 max-w-2xl mx-auto">
                        ${data.dialog.map(dlg => `
                            <div class="flex items-start space-x-3">
                                <div class="w-8 h-8 rounded-full ${dlg.speaker === 'A' || dlg.speaker === 'Cliente' ? 'bg-slate-900' : 'bg-amber-500'} text-white font-bold flex items-center justify-center text-xs flex-shrink-0">${dlg.speaker.charAt(0)}</div>
                                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex-grow flex items-center justify-between">
                                    <div><span class="text-[10px] uppercase font-bold text-slate-400 block">${dlg.speaker}</span><span class="font-medium text-slate-800 text-sm">${dlg.text}</span></div>
                                    <button onclick="speakText('${dlg.text}')" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-volume-high"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div id="quiz" class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-6 h-6 rounded-md bg-amber-500/20 border border-amber-500/30 text-amber-400 flex items-center justify-center text-[10px] shadow-sm">
                            <i class="fa-solid fa-pencil text-[10px] text-amber-400"></i>
                        </div>
                        <div><h3 class="text-xl font-bold text-white">Day ${data.day} Mini Quiz</h3><p class="text-xs text-slate-400">Test your knowledge for today's module</p></div>
                    </div>
                    <div class="space-y-6" id="quizQuestionsContainer">
                        ${data.quiz.map((qObj, qIdx) => `
                            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl space-y-3">
                                <h4 class="font-semibold text-white text-sm">Question ${qIdx + 1}: ${qObj.q}</h4>
                                <div class="space-y-2">
                                    ${qObj.options.map((opt, oIdx) => `
                                        <button onclick="checkAnswer(${qIdx}, ${oIdx}, this, ${qObj.correct})" class="w-full text-left px-4 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700 text-sm text-slate-300 hover:border-amber-500 hover:text-white transition">
                                            ${opt}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div id="quizResult" class="hidden mt-6 p-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 text-center font-semibold text-sm">
                        🎉 Excellent work! You completed the Day ${data.day} quiz successfully. Ready for the next day!
                    </div>
                </div>
            `;
            quizAnsweredCount = 0;
            quizCorrectCount = 0;
            currentQuizTotal = data.quiz.length;
        }

        let quizAnsweredCount = 0;
        let quizCorrectCount = 0;
        let currentQuizTotal = 10;

        function checkAnswer(qIndex, selectedOption, btnElement, correctOption) {
            const parent = btnElement.parentElement;
            const buttons = parent.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            if (selectedOption === correctOption) {
                btnElement.classList.remove('bg-slate-900/60', 'border-slate-700', 'text-slate-300');
                btnElement.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white', 'font-semibold');
                quizCorrectCount++;
            } else {
                btnElement.classList.remove('bg-slate-900/60', 'border-slate-700', 'text-slate-300');
                btnElement.classList.add('bg-red-600', 'border-red-500', 'text-white', 'font-semibold');
                buttons[correctOption].classList.remove('bg-slate-900/60', 'border-slate-700', 'text-slate-300');
                buttons[correctOption].classList.add('bg-emerald-600', 'border-emerald-500', 'text-white', 'font-semibold');
            }

            quizAnsweredCount++;
            if (quizAnsweredCount === currentQuizTotal) {
                const resultBox = document.getElementById('quizResult');
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `🎉 Quiz Completed! You scored ${quizCorrectCount} out of ${currentQuizTotal}. Great job on Day ${curriculum[currentDayIndex].day}!`;
            }
        }

        window.onload = function() {
            initDaySelector();
            renderCurrentDay();
        };
    </script>
</body>
</html>
