<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oxford 3000™ — English Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#1B2A3D;
    --cover-dark:#121E2C;
    --paper:#F7F4EC;
    --paper-line:#E1DACB;
    --ink:#241F19;
    --ink-soft:#6B6152;
    --gold:#B4923D;
    --gold-soft:#D8C48F;
    --teal:#2E5F58;
    --wine:#7A3B3B;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', 'Noto Sans Bengali', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .bn{ font-family:'Noto Sans Bengali','Work Sans', sans-serif; }

  /* ---------- COVER ---------- */
  .cover{
    background:linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:var(--gold-soft);
    padding:52px 24px 40px;
    text-align:center;
    position:relative;
    animation:coverIn .7s ease-out;
  }
  @keyframes coverIn{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .cover h1{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:clamp(26px, 6vw, 40px);
    margin:0 0 10px;
    letter-spacing:0.3px;
    color:#F3E9CE;
  }
  .cover .rule{
    width:64px;
    height:2px;
    background:var(--gold);
    margin:16px auto;
    border:none;
  }
  .cover p{
    font-size:15px;
    color:#B9C3CF;
    max-width:460px;
    margin:0 auto;
    line-height:1.6;
  }
  .cover .note{
    margin-top:14px;
    font-size:12.5px;
    color:#8F9CAA;
    max-width:460px;
  }

  /* ---------- TABS ---------- */
  .tabs-wrap{
    background:var(--cover);
    padding:0 12px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
    border-bottom:3px solid var(--gold);
  }
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .tabs{
    display:inline-flex;
    gap:2px;
    padding:10px 4px;
  }
  .tab-btn{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:#AEB9C6;
    background:transparent;
    border:none;
    padding:9px 14px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    transition:color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{ color:#EFE6CC; }
  .tab-btn.active{
    color:#1B2A3D;
    background:var(--gold-soft);
    font-weight:600;
  }

  /* ---------- SEARCH ---------- */
  .search-row{
    max-width:900px;
    margin:26px auto 8px;
    padding:0 20px;
  }
  .search-row input{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--paper-line);
    padding:8px 2px 10px;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-row input:focus{ border-bottom-color:var(--gold); }
  .search-row input::placeholder{ color:#A79E8C; }

  .meta-line{
    max-width:900px;
    margin:0 auto;
    padding:10px 22px 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---------- ENTRIES ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:18px 16px 70px;
  }
  .entries{
    columns:2 340px;
    column-gap:36px;
  }
  .entry{
    break-inside:avoid;
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
    margin-bottom:2px;
  }
  .entry-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:3px;
  }
  .entry-word{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
  }
  .entry-pos{
    font-family:'Lora', serif;
    font-style:italic;
    font-size:13px;
    color:var(--teal);
  }
  .entry-ipa{
    font-size:13.5px;
    color:var(--wine);
    margin:0 0 6px;
  }
  .entry-bn{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .entry-example{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .entry-example .en{
    font-style:italic;
  }
  .entry-example .bnex{
    color:var(--ink-soft);
    display:block;
    margin-top:2px;
  }

  .no-results{
    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:14.5px;
    display:none;
  }

  footer{
    text-align:center;
    padding:22px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--paper-line);
  }
  footer .copyright{
    margin-top:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:0.2px;
  }

  .back-to-top{
    position:fixed;
    right:18px;
    bottom:20px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--cover);
    border:1.5px solid var(--gold);
    color:var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(18,30,44,0.35);
    opacity:0;
    visibility:hidden;
    transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s ease;
    z-index:50;
  }
  .back-to-top.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }
  .back-to-top:hover{
    background:var(--cover-dark);
  }
  .back-to-top svg{
    width:18px;
    height:18px;
  }

  .back-to-bottom{
    position:fixed;
    right:18px;
    bottom:70px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--cover);
    border:1.5px solid var(--gold);
    color:var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(18,30,44,0.35);
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s ease;
    z-index:50;
  }
  .back-to-bottom.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }
  .back-to-bottom:hover{
    background:var(--cover-dark);
  }
  .back-to-bottom svg{
    width:18px;
    height:18px;
  }

  .scroll-down{
    margin:22px auto 0;
    width:38px;
    height:38px;
    border-radius:50%;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s ease, transform .2s ease;
    animation:bob 2s ease-in-out infinite;
  }
  .scroll-down:hover{
    background:rgba(180,146,61,0.15);
  }
  .scroll-down svg{
    width:16px;
    height:16px;
  }
  @keyframes bob{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(4px); }
  }

  @media (max-width:600px){
    .entries{ columns:1; }
    .cover{ padding:40px 20px 30px; }
  }
</style>
</head>

  </button>
</div>

<div class="tabs-wrap">

</div>

<div class="search-row">

<div class="meta-line" id="metaLine"></div>

<main>

</main>

<footer>
  <div>The Oxford 3000 vocabulary guide for daily English practice</div>

</footer>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14"></path>
    <path d="M19 12l-7 7-7-7"></path>
  </svg>
</button>

<button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"></path>

  </svg>
</button>

  {cat:'other', en:'can', ipa:'/kæn/', bn:'পারা', ex:'I can swim very well.', exBn:'আমি খুব ভালো সাঁতার কাটতে পারি।'},
];

const posMap = Object.fromEntries(categories.filter(c=>c.abbr).map(c=>[c.key,c.abbr]));

const tabsEl = document.getElementById('tabs');
const entriesEl = document.getElementById('entries');
const noResultsEl = document.getElementById('noResults');
const searchEl = document.getElementById('search');
const metaLineEl = document.getElementById('metaLine');

let activeCat = 'all';
let query = '';

function counts(){
  const c = {};
  data.forEach(d => c[d.cat] = (c[d.cat]||0)+1);
  return c;
}
const catCounts = counts();

categories.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (c.key === activeCat ? ' active' : '');
  const n = c.key === 'all' ? data.length : (catCounts[c.key]||0);
  btn.textContent = c.label + ' (' + n + ')';
  btn.addEventListener('click', () => {
    activeCat = c.key;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
  tabsEl.appendChild(btn);
});

searchEl.addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase();
  render();
});

function render(){
  const filtered = data.filter(d => {
    const matchesCat = activeCat === 'all' || d.cat === activeCat;
    const matchesQuery = !query || d.en.toLowerCase().includes(query) || d.bn.includes(query);
    return matchesCat && matchesQuery;
  });

  entriesEl.innerHTML = '';
  noResultsEl.style.display = filtered.length ? 'none' : 'block';
  metaLineEl.textContent = filtered.length + (filtered.length === 1 ? ' word' : ' words');

  filtered.forEach(d => {
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `
      <div class="entry-head">
        <span class="entry-word">${d.en}</span>
        <span class="entry-pos">${posMap[d.cat] || ''}</span>
      </div>
      <p class="entry-ipa">${d.ipa}</p>
      <p class="entry-bn bn">${d.bn}</p>
      <p class="entry-example">
        <span class="en">${d.ex}</span>
        <span class="bnex bn">${d.exBn}</span>
      </p>
    `;
    entriesEl.appendChild(el);
  });
}

render();

const backToTopBtn = document.getElementById('backToTop');
const backToBottomBtn = document.getElementById('backToBottom');
function updateScrollButtons(){
  const nearBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300;
  backToTopBtn.classList.toggle('visible', window.scrollY > 400);
  backToBottomBtn.classList.toggle('visible', !nearBottom);
}
window.addEventListener('scroll', updateScrollButtons);
window.addEventListener('resize', updateScrollButtons);
updateScrollButtons();

backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
backToBottomBtn.addEventListener('click', () => {
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
});

const scrollDownBtn = document.getElementById('scrollDown');
scrollDownBtn.addEventListener('click', () => {
  document.querySelector('.tabs-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>

</html>
